min_version = "2026.10.3"

[settings]
lockfile = true
lockfile_platforms = ["windows-x64", "linux-x64"]
minimum_release_age = "24h"

[tools]
node = "24.19.0"
"npm:@gltf-transform/cli" = "4.5.1"
"npm:gltfpack" = "1.3.0"
"npm:@babylonjs/mcp-servers" = "9.28.0"

[tasks."repro:verify"]
description = "Verify the committed reproducibility contract without requiring host-only creative tools."
run = [
  "node --check tooling/creative-capabilities/verify-workstation.mjs",
  "node tooling/creative-capabilities/verify-workstation.mjs --ci"
]

[tasks."workstation:status"]
description = "Inspect reusable workstation bootstrap state without changing the machine."
dir = "tooling/reconstruction-workstation"
run = "mise bootstrap status"

[tasks."workstation:plan"]
description = "Preview reusable workstation changes without applying them."
dir = "tooling/reconstruction-workstation"
run = "mise bootstrap --dry-run"

[tasks."workstation:apply"]
description = "Apply the reusable workstation profile."
dir = "tooling/reconstruction-workstation"
run = "mise bootstrap --yes"

[tasks."workstation:verify"]
description = "Verify the current host's reusable creative capabilities and integration surfaces."
run = "node tooling/creative-capabilities/verify-workstation.mjs"

[tasks."workstation:verify-strict"]
description = "Fail when an expected reusable workstation capability is unavailable."
run = "node tooling/creative-capabilities/verify-workstation.mjs --strict"


[tasks."hardening:preflight"]
description = "Read-only Stage 2 skill-hardening tool inventory; never downloads or modifies local state."
run = "node tooling/skill-hardening/verify-host.mjs"

[tasks."hardening:preflight-test"]
description = "Deterministic offline tests for Stage 2 host preflight."
run = "node --test tooling/skill-hardening/verify-host.test.mjs"
