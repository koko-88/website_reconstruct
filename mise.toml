min_version = "2026.10.3"

[settings]
lockfile = true
lockfile_platforms = ["windows-x64", "linux-x64"]
minimum_release_age = "24h"

[tools]
node = "24.19.0"
"npm:@gltf-transform/cli" = "4.5.1"
"npm:gltfpack" = "1.3.0"
"npm:@babylonjs/mcp-servers" = "9.28.0"

[tasks."repro:verify"]
description = "Run native reconstruction tooling regressions with serial suite workers."
run = [
  "node --test --test-concurrency=1 --test-timeout=180000 skills/reference-reconstruction/scripts/test-capture.mjs skills/reference-reconstruction/scripts/test-settled-appearance.mjs skills/reference-reconstruction/scripts/test-assets.mjs"
]
