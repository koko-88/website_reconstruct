name: Reproducibility

on:
  push:
    branches: [main]
    paths:
      - "mise.toml"
      - "mise.lock"
      - ".mise/locks/**"
      - "skills/reference-reconstruction/**"
      - "implementation-scope/pre-build-packet/**"
      - "reference/**"
      - "specs/**"
      - "model-selection/**"
      - ".specify/**"
      - "PRODUCT.md"
      - "ROADMAP.md"
      - "LOGIC_VERIFICATION.md"
      - "IMPLEMENTATION_VERIFICATION.md"
      - ".github/workflows/reproducibility.yml"
      - "AGENTS.md"
      - ".gitignore"
      - ".gitattributes"
      - ".sonarcloud.properties"
      - "CLAUDE.md"
      - ".agents/skills/**"
      - ".cursor/skills/**"
      - ".clinerules/workflows/**"
      - ".opencode/commands/**"
  pull_request:
    paths:
      - "mise.toml"
      - "mise.lock"
      - ".mise/locks/**"
      - "skills/reference-reconstruction/**"
      - "implementation-scope/pre-build-packet/**"
      - "reference/**"
      - "specs/**"
      - "model-selection/**"
      - ".specify/**"
      - "PRODUCT.md"
      - "ROADMAP.md"
      - "LOGIC_VERIFICATION.md"
      - "IMPLEMENTATION_VERIFICATION.md"
      - ".github/workflows/reproducibility.yml"
      - "AGENTS.md"
      - ".gitignore"
      - ".gitattributes"
      - ".sonarcloud.properties"
      - "CLAUDE.md"
      - ".agents/skills/**"
      - ".cursor/skills/**"
      - ".clinerules/workflows/**"
      - ".opencode/commands/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Reproducibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install locked project toolchain
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          version: "2026.10.3"
          install_args: "--locked"

      - name: Prove lockfile is current
        run: |
          mise lock
          git diff --exit-code -- mise.lock .mise/locks

      - name: Install committed reconstruction test dependencies
        run: npm ci --ignore-scripts --prefix skills/reference-reconstruction

      - name: Require declared asset parsers
        run: node --input-type=module -e "await import('./skills/reference-reconstruction/scripts/assets.mjs')"

      - name: Verify tooling regressions with optional integrations explicitly scoped
        run: |
          mise run repro:verify
          printf '%s\n' 'Tooling regressions passed. Optional browser/font/media checks are NOT_RUN when their inputs are absent; consult native test output for skips. This job does not certify browser integration or website acceptance.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify evidence and linked governance
        run: mise exec -- python implementation-scope/pre-build-packet/verify.py

      - name: Verify evidence checkout portability
        run: mise exec -- python -m unittest discover -s implementation-scope/pre-build-packet -p 'test_*.py'
