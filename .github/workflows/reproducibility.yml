name: Reproducibility

on:
  push:
    branches: [main]
    paths:
      - "mise.toml"
      - "mise.lock"
      - ".mise/locks/**"
      - "skills/reference-reconstruction/**"
      - "implementation-scope/pre-build-packet/**"
      - "reference/**"
      - "specs/**"
      - "model-selection/*.md"
      - ".specify/**"
      - "PRODUCT.md"
      - "ROADMAP.md"
      - "LOGIC_VERIFICATION.md"
      - "IMPLEMENTATION_VERIFICATION.md"
      - ".github/workflows/reproducibility.yml"
      - "AGENTS.md"
      - ".gitignore"
  pull_request:
    paths:
      - "mise.toml"
      - "mise.lock"
      - ".mise/locks/**"
      - "skills/reference-reconstruction/**"
      - "implementation-scope/pre-build-packet/**"
      - "reference/**"
      - "specs/**"
      - "model-selection/*.md"
      - ".specify/**"
      - "PRODUCT.md"
      - "ROADMAP.md"
      - "LOGIC_VERIFICATION.md"
      - "IMPLEMENTATION_VERIFICATION.md"
      - ".github/workflows/reproducibility.yml"
      - "AGENTS.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Reproducibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install locked project toolchain
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          version: "2026.10.3"
          install_args: "--locked"

      - name: Prove lockfile is current
        run: |
          mise lock
          git diff --exit-code -- mise.lock .mise/locks

      - name: Install committed reconstruction test dependencies
        run: npm ci --prefix skills/reference-reconstruction

      - name: Require declared asset parsers
        run: node --input-type=module -e "await import('./skills/reference-reconstruction/scripts/assets.mjs')"

      - name: Verify reproducibility contract
        run: mise run repro:verify

      - name: Verify evidence and linked governance
        run: python3 implementation-scope/pre-build-packet/verify.py
