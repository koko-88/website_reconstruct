name: Reproducibility

on:
  push:
    branches: [main]
    paths:
      - "mise.toml"
      - "mise.lock"
      - "tooling/reconstruction-workstation/**"
      - "tooling/creative-capabilities/**"
      - ".github/workflows/reproducibility.yml"
      - "AGENTS.md"
      - ".gitignore"
  pull_request:
    paths:
      - "mise.toml"
      - "mise.lock"
      - "tooling/reconstruction-workstation/**"
      - "tooling/creative-capabilities/**"
      - ".github/workflows/reproducibility.yml"
      - "AGENTS.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Reproducibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install locked project toolchain
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          version: "2026.10.3"
          install_args: "--locked"

      - name: Verify reproducibility contract
        run: mise run repro:verify
