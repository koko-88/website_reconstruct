name: Creative Production
on:
  pull_request:
    paths: ['packages/**', 'projects/creative-workbench/**', 'tooling/creative/**', 'skills/creative-production/**', 'package.json', 'package-lock.json', '.github/workflows/creative-production.yml']
  push:
    branches: [main]
    paths: ['packages/**', 'projects/creative-workbench/**', 'tooling/creative/**', 'skills/creative-production/**', 'package.json', 'package-lock.json', '.github/workflows/creative-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CREATIVE_BROWSER_CHANNEL: chromium
      CREATIVE_SOFTWARE_GPU: '1'
      CREATIVE_RUN_ID: ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          version: '2026.10.3'
          install_args: '--locked node'
      - run: npm ci --workspace @ai-factory/creative-workbench --workspace @ai-factory/creative-assets --include-workspace-root=false --ignore-scripts
      - run: npm run creative:check
      - name: Ensure native media tools
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          for native_tool in ffmpeg ffprobe; do
            native_path="$(command -v "$native_tool")" || { echo "Missing required media verification tool: $native_tool" >&2; exit 1; }
            native_variable="CREATIVE_${native_tool^^}_PATH"
            printf '%s=%s\n' "$native_variable" "$native_path" >> "$GITHUB_ENV"
          done
      - run: npm run creative:build
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify native and browser media decoding
        env:
          CREATIVE_MEDIA_BROWSER: '1'
          CREATIVE_BROWSER_CHANNEL: chrome
        run: |
          command -v google-chrome >/dev/null || npx --no-install playwright install chrome
          npm run creative:verify-media
      - run: npm run creative:test
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, verified official release
        with:
          name: creative-browser-evidence
          path: artifacts/creative-production/ci/
          retention-days: 14
          if-no-files-found: warn
      - name: State coverage boundary
        if: always()
        run: echo 'Creative browser checks use software WebGL. They do not certify workstation GPU performance, Blender MCP, paid providers, or HBC fidelity.' >> "$GITHUB_STEP_SUMMARY"
