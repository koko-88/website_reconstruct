# Automatic-analysis scope: maintained engineering tools and CI.
# Frozen reference/ and skill-hardening/ audit snapshots are evidence, not maintained code.
# .mise/locks/ contains mise-managed aube locks, checked by the reproducibility workflow.
# Add an admitted application source directory when its implementation package is selected.
sonar.sources=.github,skills,model-selection,implementation-scope,.specify
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Keep tests analyzed as tests; exact paths avoid unsupported automatic-analysis wildcards.
sonar.tests=skills/reference-reconstruction/scripts,implementation-scope/pre-build-packet
sonar.test.inclusions=skills/reference-reconstruction/scripts/test-assets.mjs,skills/reference-reconstruction/scripts/test-capture.mjs,skills/reference-reconstruction/scripts/test-settled-appearance.mjs,implementation-scope/pre-build-packet/test_checkout.py
sonar.exclusions=skills/reference-reconstruction/scripts/test-assets.mjs,skills/reference-reconstruction/scripts/test-capture.mjs,skills/reference-reconstruction/scripts/test-settled-appearance.mjs,implementation-scope/pre-build-packet/test_checkout.py
